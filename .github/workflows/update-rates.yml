name: Update Remittance Rates

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium

      - name: Run rate pipeline
        run: |
          python scripts/run_pipeline.py
          
            - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "============================================================"
          echo "Git status before commit"
          echo "============================================================"
          git status --short

          echo "============================================================"
          echo "Changed files summary"
          echo "============================================================"
          git diff --stat || true

          echo "============================================================"
          echo "Latest dashboard timestamp"
          echo "============================================================"
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/dashboard.json")
          if path.exists():
              data = json.loads(path.read_text(encoding="utf-8"))
              print(json.dumps(data.get("last_updated", data.get("updated_at", "Not found")), ensure_ascii=False, indent=2))
          else:
              print("data/dashboard.json not found")
          PY

          git add data database

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update remittance rates data"
            git push
            echo "Data committed and pushed successfully"
          fi