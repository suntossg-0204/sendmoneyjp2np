name: Update Remittance Rates

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml playwright

      - name: Install Playwright browser
        run: python -m playwright install chromium

      - name: Run RemitTracker pipeline
        run: python scripts/run_pipeline.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add database/rates.db data/latest.json data/daily_summary.json exports/latest.json exports/daily_summary.json
          git commit -m "Update remittance data" || echo "No changes"
          git push