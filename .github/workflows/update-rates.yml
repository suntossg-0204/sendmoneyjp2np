name: Update Remittance Rates

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium

      - name: Run rate pipeline
        run: |
          python scripts/run_pipeline.py
          
      - name: Debug latest database rows
        run: |
          python -c "import sqlite3; conn=sqlite3.connect('database/rates.db'); cur=conn.cursor(); cur.execute('SELECT company_name, rate, collected_at FROM rate_history ORDER BY collected_at DESC LIMIT 15'); [print(row) for row in cur.fetchall()]; conn.close()"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data database
          git commit -m "Update remittance rates data" || echo "No changes to commit"
          git push