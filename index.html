<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RemitTracker JP</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">Japan 🇯🇵 → Nepal 🇳🇵</p>
        <h1>RemitTracker JP</h1>
        <p class="subtitle">Private remittance rate tracker and calculator</p>
      </div>
      <div class="status-card">
        <span>Last updated</span>
        <strong id="lastUpdated">Loading...</strong>
      </div>
    </header>

    <section class="calculator-card">
      <label for="amountInput">Amount to receive (NPR)</label>
      <div class="amount-row">
        <span>NPR</span>
        <input id="amountInput" type="number" value="100000" min="0" />
      </div>
    </section>

    <section class="summary-grid">
      <div class="summary-card best">
        <span>Best company</span>
        <strong id="bestCompany">-</strong>
      </div>
      <div class="summary-card">
        <span>Best received</span>
        <strong id="bestReceived">-</strong>
      </div>
      <div class="summary-card">
        <span>Difference</span>
        <strong id="differenceAmount">-</strong>
      </div>
    </section>

    <section>
      <h2>Live ranking</h2>
      <div id="companyList" class="company-list"></div>
    </section>

    <footer>
      <p>Data updates automatically via GitHub Actions.</p>
    </footer>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
